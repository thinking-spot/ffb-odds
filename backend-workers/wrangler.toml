name = "ffb-odds-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "ffb-odds-db"
database_id = "fe17c756-e66d-4f9e-acba-f649ed4a0636"

# KV Namespace for Caching
[[kv_namespaces]]
binding = "CACHE"
id = "eb04c388cc8e49a39f7389ece7269bd3"

# Cron Triggers for Daily Updates
# 10am ET = 2pm UTC (EST - winter) or 3pm UTC (EDT - summer)
# Using 3pm UTC to cover both timezones (will be 10am EDT, 11am EST)
[triggers]
crons = ["0 15 * * *"]  # 3pm UTC = 10am EST / 11am EDT

# Environment Variables (non-secret)
[vars]
ENVIRONMENT = "production"
CURRENT_SEASON = "2024"
DEFAULT_WEEK = "10"
FRONTEND_URL = "https://ffb-odds-813.pages.dev"

# Secrets (set via: wrangler secret put <NAME>)
# ODDS_API_KEY
# NFL_API_KEY
# NFL_API_HOST
# YAHOO_CLIENT_ID
# YAHOO_CLIENT_SECRET
